[package]
name = "solana-indexer-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
solana-client = { version = "1.18", default-features = false }
solana-sdk = { version = "1.18", default-features = false }
solana-transaction-status = { version = "1.18", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
deadpool-postgres = "0.12"
native-tls = "0.2"
postgres-native-tls = "0.5"
chrono = "0.4"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
dotenv = "0.15"
thiserror = "2.0.18"

[dev-dependencies]
quickcheck = "1.0"
quickcheck_macros = "1.0"
